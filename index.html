<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Meu Streaming</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="logo">StreamFlix</div>
        <nav>
            <a href="index.html" style="color: #fff; font-weight: bold;">Início</a>
            <a href="filmes.html">Filmes</a>
            <a href="#">Séries</a>
        </nav>
    </header>

    <!-- BANNER PRINCIPAL -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Dia D (2026)</h1>
            <p class="hero-desc">Assista agora ao filme em alta definição direto da sua plataforma.</p>
            <!-- Substitua ttXXXXXXX pelo ID do IMDb do filme "Dia D" -->
            <button class="btn btn-play" onclick="openPlayer('https://superflixapi.pro/filme/tt15047880')">▶ Assistir</button>
        </div>
    </section>

    <!-- CATÁLOGO DE MÍDIAS -->
    <section class="catalog">
        <h2 class="section-title">Em Destaque</h2>
        <div class="cards-row">
            
            <!-- CARD 1: Exemplo com SuperFlix API usando o ID do IMDb -->
            <div class="card" style="background-image: url('imagens/diad.jpg');" onclick="openPlayer('https://superflixapi.pro/filme/tt15047880')">
                <div class="card-info">
                    <div class="card-title">Dia D (2026)</div>
                </div>
            </div>

            <!-- CARD 2: Exemplo com SuperFlix API usando ID numérico do TMDB -->
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400');" onclick="openPlayer('https://superflixapi.pro/filme/15047880')">
                <div class="card-info">
                    <div class="card-title">Filme Exemplo TMDB</div>
                </div>
            </div>

            <!-- CARD 3: Exemplo com arquivo local MP4 -->
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=400');" onclick="openPlayer('meu-video.mp4')">
                <div class="card-info">
                    <div class="card-title">Vídeo Local (MP4)</div>
                </div>
            </div>

        </div>
    </section>

    <!-- MODAL DO REPRODUTOR DE VÍDEO / IFRAME -->
    <div class="modal" id="videoModal">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        
        <!-- Player para arquivos .mp4 de vídeo direto -->
        <video id="mainVideo" controls playsinline style="display: none;">
            <source id="videoSource" src="" type="video/mp4">
            Seu navegador não suporta este vídeo.
        </video>

        <!-- Player para Iframe da SuperFlix API -->
        <iframe id="mainIframe" src="" frameborder="0" allowfullscreen style="display: none;"></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
