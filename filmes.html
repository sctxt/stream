<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Filmes</title>
    <!-- Reaproveita o mesmo estilo da página principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header>
        <div class="logo">StreamFlix</div>
        <nav>
            <a href="index.html">Início</a>
            <a href="filmes.html" style="color: #fff; font-weight: bold;">Filmes</a>
            <a href="#">Séries</a>
        </nav>
    </header>

    <!-- BANNER DE DESTAQUE DE FILMES -->
    <section class="hero" style="background-image: linear-gradient(to top, #141414, transparent), linear-gradient(to right, rgba(0,0,0,0.8), transparent 60%), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200');">
        <div class="hero-content">
            <h1 class="hero-title">Catálogo de Filmes</h1>
            <p class="hero-desc">Explore todos os filmes disponíveis na sua rede local. Escolha um título abaixo e aproveite!</p>
        </div>
    </section>

    <!-- SEÇÃO DE FILMES DE COMÉDIA / OUTROS -->
    <section class="catalog" style="margin-top: 20px;">
        <h2 class="section-title">Todos os Filmes</h2>
        <div class="cards-row">
            
            <div class="card" style="background-image: url('imagens/diad.jpg');" onclick="openPlayer('diad.mp4')">
                <div class="card-info">
                    <div class="card-title">Dia D</div>
                </div>
            </div>

            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=400');" onclick="openPlayer('video2.mp4')">
                <div class="card-info">
                    <div class="card-title">Vídeo Secundário</div>
                </div>
            </div>

        </div>
    </section>

    <!-- MODAL DO REPRODUTOR DE VÍDEO -->
    <div class="modal" id="videoModal">
        <span class="close-btn" onclick="closePlayer()">&times;</span>
        <video id="mainVideo" controls playsinline>
            <source id="videoSource" src="" type="video/mp4">
            Seu navegador não suporta este vídeo.
        </video>
    </div>

    <!-- Reaproveita o mesmo Script de controle do vídeo -->
    <script src="script.js"></script>
</body>
</html>
